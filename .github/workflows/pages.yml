# Deploy the HUD (web/) to GitHub Pages. No build step: web/ is static
# (HTML/CSS/JS, zero dependencies), so the directory is uploaded as-is.
# The HUD opens standalone in demo mode on the Pages URL; a real GCS can
# still be used by pointing the browser at http://<host>:8501.
name: Deploy HUD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
